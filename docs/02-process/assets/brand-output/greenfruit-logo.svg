<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">绿果果 GreenFruit 品牌 Logo</title>
  <desc id="desc">A fresh lime slice, leaf and delivery motion mark for the GreenFruit fresh produce delivery system.</desc>
  <defs>
