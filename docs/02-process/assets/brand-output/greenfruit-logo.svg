    <filter id="softShadow" x="18" y="12" width="292" height="292" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#08724F" flood-opacity="0.18"/>
    </filter>
