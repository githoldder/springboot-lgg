<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850">
    <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2563eb"/></marker><marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#00b894"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#f59e0b"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#ef4444"/></marker><marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7c3aed"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#9aa8b5"/></marker>
  </defs>
    <style>text{dominant-baseline:middle}.small{font-size:14px}</style>
    <text x="520" y="44" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="32" font-weight="800" fill="#17212b"><tspan x="520" dy="0">系统分层模块架构图</tspan></text>
    
    <rect x="70" y="105" width="900" height="105" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="520" y="135" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="18" font-weight="700" fill="#17212b"><tspan x="520" dy="0">表现层 Presentation</tspan></text><text x="520" y="163" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">若依 Vue3 管理端：Dashboard / 水果管理 / 套餐管理 / 订单管理 / 骑手指派 / 小票打印</tspan></text><text x="520" y="185" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">微信小程序：商品浏览 / 购物车 / 配送方式 / 支付返回 / 订单状态</tspan></text>
    <rect x="70" y="245" width="900" height="105" rx="0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="520" y="275" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="18" font-weight="700" fill="#17212b"><tspan x="520" dy="0">接口与网关层 API Gateway</tspan></text><text x="520" y="303" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">lgg-gateway：统一入口、路由断言、跨域处理、服务发现转发</tspan></text><text x="520" y="325" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">REST API + WebSocket 连接入口</tspan></text>
    <rect x="70" y="385" width="900" height="130" rx="0" fill="#e9f8f1" stroke="#00b894" stroke-width="2"/><text x="520" y="415" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="18" font-weight="700" fill="#17212b"><tspan x="520" dy="0">业务应用层 Business Services</tspan></text><text x="520" y="443" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">lgg-business：分类、水果、套餐、购物车、订单、骑手、报表、小票</tspan></text><text x="520" y="465" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">lgg-pay：模拟支付与回调  /  lgg-notice：消息通知  /  lgg-admin：系统管理与监控</tspan></text>
    <rect x="70" y="555" width="900" height="105" rx="0" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="520" y="585" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="18" font-weight="700" fill="#17212b"><tspan x="520" dy="0">基础设施层 Infrastructure</tspan></text><text x="520" y="613" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">Nacos 服务注册配置、OpenFeign 服务调用、RabbitMQ 异步消息、WebSocket 实时提醒</tspan></text><text x="520" y="635" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">PM2 长运行进程守护、Actuator 健康检查、Newman 与 Playwright 自动化验证</tspan></text>
    <rect x="70" y="695" width="900" height="105" rx="0" fill="#f8fafc" stroke="#9aa8b5" stroke-width="2"/><text x="520" y="725" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="18" font-weight="700" fill="#17212b"><tspan x="520" dy="0">数据资源层 Data Resources</tspan></text><text x="520" y="753" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">MySQL：业务数据与系统权限表  /  Redis：缓存与会话  /  MinIO：图片与品牌资产</tspan></text><text x="520" y="775" text-anchor="middle" font-family="'Times New Roman','SimSun'" font-size="14" font-weight="400" fill="#536471"><tspan x="520" dy="0">预留按服务拆库与对象存储独立扩展能力</tspan></text>
