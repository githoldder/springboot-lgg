<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常工鲜生 · 管理后台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif; background: #f0f2f5; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: #304156; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; }
  .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .sidebar-header h2 { font-size: 18px; font-weight: 600; }
  .sidebar-header p { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; }
  .sidebar-menu { flex: 1; padding: 10px 0; }
  .menu-item { padding: 14px 24px; cursor: pointer; color: rgba(255,255,255,0.7); font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .menu-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .menu-item.active { color: #fff; background: #409eff; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .navbar { height: 50px; background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }
  .navbar-left h3 { font-size: 16px; font-weight: 500; color: #333; }
  .navbar-right { display: flex; align-items: center; gap: 20px; }
  .user-info { font-size: 14px; color: #333; display: flex; align-items: center; gap: 8px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #409eff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; }
  .content { padding: 20px; flex: 1; }
  .toast-container { position: fixed; top: 60px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
  .toast { width: 380px; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); overflow: hidden; animation: slideIn 0.3s ease; cursor: pointer; }
  .toast-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
  .toast-header .icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .toast-header .icon.new-order { background: #fff2f0; color: #ff4d4f; }
  .toast-header .toast-title { font-size: 14px; font-weight: 600; color: #333; flex: 1; }
  .toast-header .toast-time { font-size: 11px; color: #bbb; }
  .toast-body { padding: 8px 18px 14px 56px; font-size: 13px; color: #555; line-height: 1.6; }
  .toast-body strong { color: #409eff; }
  .toast-footer { background: #fafafa; padding: 10px 18px; border-top: 1px solid #f0f0f0; font-size: 12px; color: #409eff; text-align: right; }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .toast.shake { animation: slideIn 0.3s ease, shake 0.3s ease 0.3s; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .stat-card .label { font-size: 13px; color: #999; margin-bottom: 8px; }
  .stat-card .value { font-size: 28px; font-weight: 600; color: #333; }
  .stat-card .trend { font-size: 12px; margin-top: 8px; }
  .stat-card .trend.up { color: #67c23a; }
  .panel { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 20px; margin-bottom: 16px; }
  .panel-title { font-size: 16px; font-weight: 500; color: #333; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
  .conn-bar { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 6px; padding: 8px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; }
  .conn-bar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .conn-bar .dot.green { background: #22c55e; }
  .conn-bar .dot.red { background: #ef4444; }
  .conn-bar .dot.yellow { background: #f59e0b; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .ws-log { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 12px; max-height: 160px; overflow-y: auto; font-size: 12px; font-family: 'SF Mono', Monaco, monospace; }
  .ws-log-item { padding: 3px 0; color: #666; border-bottom: 1px solid #f0f0f0; }
  .ws-log-item:last-child { border-bottom: none; }
  .ws-log-item .time { color: #bbb; margin-right: 8px; }
  .ws-log-item .tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 10px; margin-right: 6px; }
  .ws-log-item .tag.in { background: #dbeafe; color: #1d4ed8; }
  .ws-log-item .tag.out { background: #fef3c7; color: #d97706; }
  .order-row { padding: 10px 0; border-bottom: 1px solid #f5f5f5; display: flex; align-items: center; gap: 16px; }
  .order-row:last-child { border-bottom: none; }
  .order-row .num { font-size: 13px; color: #409eff; font-weight: 500; width: 140px; }
  .order-row .amt { font-size: 14px; font-weight: 600; color: #f56c6c; width: 80px; }
  .order-row .time { font-size: 12px; color: #999; flex: 1; }
  .order-row .badge-status { font-size: 11px; padding: 2px 10px; border-radius: 10px; }
  .badge-new { background: #fff2f0; color: #ff4d4f; font-weight: 600; }
  .badge-confirmed { background: #f6ffed; color: #52c41a; }
  .empty-state { text-align: center; padding: 30px; color: #ccc; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header"><h2>🍏 常工鲜生</h2><p>管理后台 v3.2</p></div>
    <div class="sidebar-menu">
      <div class="menu-item active"><span>📊</span> 工作台</div>
      <div class="menu-item"><span>📋</span> 订单管理</div>
      <div class="menu-item"><span>🥦</span> 菜品管理</div>
      <div class="menu-item"><span>📦</span> 分类管理</div>
      <div class="menu-item"><span>👥</span> 员工管理</div>
      <div class="menu-item"><span>🏪</span> 店铺管理</div>
    </div>
  </div>
  <div class="main">
    <div class="navbar">
      <div class="navbar-left"><h3>工作台</h3></div>
      <div class="navbar-right">
        <div class="user-info">
          <div class="user-avatar">管</div>
          <span>管理员</span>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="conn-bar" id="connBar">
        <span class="dot yellow" id="connDot"></span>
        <span id="connText">正在连接 WebSocket 服务器...</span>
        <span style="margin-left:auto;font-size:11px;color:#999;" id="sidDisplay"></span>
      </div>
      <div class="stats">
        <div class="stat-card"><div class="label">今日营业额</div><div class="value">¥36.30</div><div class="trend up">↑ 12% 较昨日</div></div>
        <div class="stat-card"><div class="label">有效订单</div><div class="value">2</div><div class="trend up">↑ 2 较昨日</div></div>
        <div class="stat-card" style="border-left:3px solid #f56c6c;"><div class="label">待处理订单</div><div class="value" style="color:#f56c6c;" id="pendingCount">0</div><div class="trend" style="color:#999;">暂无待处理订单</div></div>
        <div class="stat-card"><div class="label">配送中</div><div class="value">0</div></div>
      </div>
      <div class="panel">
        <div class="panel-title">
          <span>📋 实时订单</span>
          <span style="font-size:12px;font-weight:400;color:#999;">当客户下单并支付后，系统将自动推送来单提醒</span>
        </div>
        <div id="orderList"><div class="empty-state">暂无订单数据，等待推送...</div></div>
      </div>
      <div class="panel">
        <div class="panel-title">
          <span>📡 WebSocket 消息日志</span>
          <span style="font-size:12px;font-weight:400;color:#999;">实时显示服务器推送的 WebSocket 消息</span>
        </div>
        <div class="ws-log" id="wsLog"><div class="ws-log-item" style="color:#999;">等待连接...</div></div>
      </div>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
const SID = 'admin-' + Date.now();
const WS_URL = 'ws://localhost:8090/ws/' + SID;
let ws = null;
let pendingOrders = 0;
const orderList = [];

function $(id) { return document.getElementById(id); }

function wsLog(type, msg) {
  const log = $('wsLog');
  const now = new Date();
  const ts = now.toLocaleTimeString('zh-CN', { hour12: false });
  const tag = type === 'in' ? '<span class="tag in">▼ 收</span>' : '<span class="tag out">▲ 发</span>';
  const div = document.createElement('div');
  div.className = 'ws-log-item';
  div.innerHTML = `<span class="time">${ts}</span>${tag}${escapeHtml(msg)}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  const empty = log.querySelector('.ws-log-item[style*="color:#999"]');
  if (empty) empty.remove();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showToast(orderId, orderNumber, content) {
  const container = $('toastContainer');
  const now = new Date();
  const ts = now.toLocaleTimeString('zh-CN', { hour12: false });
  const toast = document.createElement('div');
  toast.className = 'toast shake';
  toast.innerHTML = `
    <div class="toast-header">
      <div class="icon new-order">🔔</div>
      <div class="toast-title">待接单 · 新订单</div>
      <div class="toast-time">${ts}</div>
    </div>
    <div class="toast-body">${escapeHtml(content)}<br>订单号：<strong>${orderNumber}</strong>（ID: ${orderId}）</div>
    <div class="toast-footer">点击查看订单详情 →</div>
  `;
  toast.onclick = () => toast.remove();
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 15000);
}

function addOrder(orderId, orderNumber, amount) {
  pendingOrders++;
  $('pendingCount').textContent = pendingOrders;
  const orderDiv = $('orderList');
  const empty = orderDiv.querySelector('.empty-state');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'order-row';
  const now = new Date();
  row.innerHTML = `
    <div class="num">#${orderNumber}</div>
    <div class="amt">¥${amount}</div>
    <div class="time">${now.toLocaleTimeString('zh-CN', { hour12: false })}</div>
    <span class="badge-status badge-new">待处理</span>
  `;
  orderDiv.insertBefore(row, orderDiv.firstChild);
  // audio alert simulation via visual flash
  document.title = '🔔 新订单! - 常工鲜生';
  setTimeout(() => { document.title = '常工鲜生 · 管理后台'; }, 5000);
}

function connect() {
  setConn('yellow', '正在连接...');
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    setConn('green', '已连接');
    $('sidDisplay').textContent = 'SID: ' + SID;
    wsLog('in', 'WebSocket 连接已建立 (ws://localhost:8090/ws/' + SID + ')');
  };
  ws.onmessage = (event) => {
    const raw = event.data;
    wsLog('in', '收到消息: ' + raw);
    try {
      const msg = JSON.parse(raw);
      if (msg.type === 1) {
        const orderId = msg.orderId || '?';
        const orderNumber = msg.content ? msg.content.match(/订单号[：:]\s*(\d+)/) : null;
        const num = orderNumber ? orderNumber[1] : '?';
        wsLog('in', '🔔 来单提醒 orderId=' + orderId + ' 订单号=' + num);
        showToast(orderId, num, msg.content);
        addOrder(orderId, num, '?');
      } else if (msg.type === 2) {
        wsLog('in', '⏰ 催单提醒: ' + msg.content);
      }
    } catch(e) {
      wsLog('in', '原始消息(非JSON): ' + raw);
    }
  };
  ws.onclose = (e) => {
    setConn('red', '已断开 (code: ' + e.code + ')');
    wsLog('in', '连接已关闭 code=' + e.code);
    setTimeout(connect, 3000);
  };
  ws.onerror = () => {
    setConn('red', '连接错误');
    wsLog('in', 'WebSocket 错误');
  };
}

function setConn(color, text) {
  const dot = $('connDot');
  dot.className = 'dot ' + color;
  $('connText').textContent = text;
}

connect();
</script>
</body>
</html>
